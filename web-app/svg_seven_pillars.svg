<svg width="100%" viewBox="0 0 680 426" role="img"><title>Carib Core architecture with seven application pillars</title><desc>Jarvis OS orchestrator connects to a group of six application pillars including separate C9 CRM and Live Agency Platform, with shared governance gates beneath.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="node c-purple" onclick="sendPrompt('Detail the Jarvis OS gateway and telemetry ingestion flow')"><rect x="40" y="30" width="600" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Jarvis OS orchestrator</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">Gateway, telemetry, learning vault</text></g><line x1="340" y1="88" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/><rect x="40" y="124" width="600" height="178" rx="12" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 4"/><text class="ts" x="56" y="142">Application pillars</text><g class="node c-teal" onclick="sendPrompt('Detail the Carib Code pillar')"><rect x="56" y="158" width="172" height="56" rx="8" stroke-width="0.5"/><text class="th" x="142" y="180" text-anchor="middle" dominant-baseline="central">Carib Code</text><text class="ts" x="142" y="198" text-anchor="middle" dominant-baseline="central">Code and delivery</text></g><g class="node c-teal" onclick="sendPrompt('Detail the Live Player Suite pillar')"><rect x="254" y="158" width="172" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="180" text-anchor="middle" dominant-baseline="central">Live Player Suite</text><text class="ts" x="340" y="198" text-anchor="middle" dominant-baseline="central">Streaming, overlays</text></g><g class="node c-teal" onclick="sendPrompt('Detail the Live Results pillar')"><rect x="452" y="158" width="172" height="56" rx="8" stroke-width="0.5"/><text class="th" x="538" y="180" text-anchor="middle" dominant-baseline="central">Live Results</text><text class="ts" x="538" y="198" text-anchor="middle" dominant-baseline="central">Meets, timing</text></g><g class="node c-teal" onclick="sendPrompt('Detail the C9 CRM pillar')"><rect x="56" y="230" width="172" height="56" rx="8" stroke-width="0.5"/><text class="th" x="142" y="252" text-anchor="middle" dominant-baseline="central">C9 CRM</text><text class="ts" x="142" y="270" text-anchor="middle" dominant-baseline="central">Vtiger V9 modernization</text></g><g class="node c-teal" onclick="sendPrompt('Detail the Live Agency Platform pillar')"><rect x="254" y="230" width="172" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">Live Agency Platform</text><text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">Creator management</text></g><g class="node c-teal" onclick="sendPrompt('Detail the Health Core pillar')"><rect x="452" y="230" width="172" height="56" rx="8" stroke-width="0.5"/><text class="th" x="538" y="252" text-anchor="middle" dominant-baseline="central">Health Core</text><text class="ts" x="538" y="270" text-anchor="middle" dominant-baseline="central">Hospital system, PACS</text></g><g class="c-gray"><rect x="40" y="330" width="600" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 4"/><text class="th" x="340" y="352" text-anchor="middle" dominant-baseline="central">Shared governance gates</text><text class="ts" x="340" y="370" text-anchor="middle" dominant-baseline="central">Creator privacy, test and production isolation</text></g></svg>