<svg width="100%" viewBox="0 0 680 384" role="img"><title>Jarvis OS gateway and telemetry ingestion flow</title><desc>Telemetry from the pillars and UniFi is posted to the api.php gateway, handed to the Jarvis bridge for agent dispatch, and logged into the learning vault.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="node c-gray" onclick="sendPrompt('What telemetry should each pillar and UniFi report to Jarvis?')"><rect x="200" y="30" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Pillars and UniFi</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">Telemetry senders</text></g><line x1="340" y1="88" x2="340" y2="114" class="arr" marker-end="url(#arrow)"/><g class="node c-purple" onclick="sendPrompt('Design the api.php telemetry_report request and response contract')"><rect x="200" y="116" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">Jarvis gateway, api.php</text><text class="ts" x="340" y="156" text-anchor="middle" dominant-baseline="central">POST ?action=telemetry_report</text></g><line x1="340" y1="174" x2="340" y2="200" class="arr" marker-end="url(#arrow)"/><g class="node c-purple" onclick="sendPrompt('How does jarvis_bridge.py dispatch agents?')"><rect x="200" y="202" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="224" text-anchor="middle" dominant-baseline="central">jarvis_bridge.py</text><text class="ts" x="340" y="242" text-anchor="middle" dominant-baseline="central">Agent dispatch, co-pilot</text></g><line x1="340" y1="260" x2="340" y2="286" class="arr" marker-end="url(#arrow)"/><g class="node c-teal" onclick="sendPrompt('How should the learning vault be structured and retained?')"><rect x="200" y="288" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="310" text-anchor="middle" dominant-baseline="central">Learning vault</text><text class="ts" x="340" y="328" text-anchor="middle" dominant-baseline="central">local_knowledge.json and .db</text></g></svg>